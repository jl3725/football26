name: TM Data

# Transfermarkt 수집 — 로컬 예약 작업(scripts/run_tm_agent.ps1)을 클라우드로 옮긴 것(2026-10-15).
# TM(AWS WAF)은 GH 러너 IP 에 202 챌린지를 주지만, 브라우저(seleniumbase UC)로 한 번 열어 받은 토큰을
# requests 에 넘기면 열린다(src/tm_http.py, 진단 scripts/diag_sources.py). 토큰은 .cache 파일로 단계 간 재사용.
#
#   daily  : 이적(transfers) · 현재 부상(injuries) · 계약(contracts) · 이적 루머(rumors) · 시장가치 스냅샷 — 8개 리그, 하루 2회
#   weekly : 선수별 통산 부상 이력(tm_injury_history) — 선수 페이지 수천 개, 주 1회(약 1.5시간)
# 실패는 ci_try 로 모아 마지막 ci_report 에서 빨간불(숨기지 않음). 품질 게이트 실패 시 커밋하지 않는다.
on:
  schedule:
    - cron: "30 1,9 * * *"   # 매일 10:30 · 18:30 KST
    - cron: "30 3 * * 1"     # 매주 월 12:30 KST — 통산 부상 이력
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | weekly"
        default: daily

concurrency:
  group: tm-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONIOENCODING: utf-8
      MODE: ${{ github.event.schedule == '30 3 * * 1' && 'weekly' || inputs.mode || 'daily' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # 수집기 의존성 + 브라우저 토큰용 seleniumbase(러너에 Chrome 기본 설치)
        run: pip install -q requests beautifulsoup4 lxml pandas unidecode seleniumbase

      - name: Collect (${{ env.MODE }})
        run: |
          if [ "$MODE" = "weekly" ]; then
            STEPS="injury_history:src/fetch_tm_injury_history.py"
          else
            STEPS="transfers:src/fetch_transfers.py injuries:src/fetch_transfermarkt_injuries.py contracts:src/sync_transfermarkt_contracts.py rumors:src/fetch_transfer_rumors.py market_value:scripts/snapshot_market_values.py"
          fi
          for LG in EPL LaLiga SerieA Bundesliga Ligue1 LigaPortugal Eredivisie BelgianProLeague; do
            for S in $STEPS; do
              NAME=${S%%:*}; SCRIPT=${S#*:}
              ARGS=""; [ "$NAME" = "contracts" ] && ARGS="--write"
              echo "── $NAME $LG"
              FB_LEAGUE=$LG bash scripts/ci_try.sh "$NAME $LG" python $SCRIPT $ARGS
            done
          done

      - name: Validate core data contracts
        run: |
          if ! python scripts/validate_data.py --no-optional; then
            echo "품질 게이트 실패 — TM 산출물 변경 폐기"
            git checkout -- data/
            exit 1
          fi

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$MODE" = "weekly" ]; then
            PATHS="data/tm_injury_history_*.csv"; SUBJECT="통산 부상 이력"
          else
            PATHS="data/transfers_*.csv data/transfermarkt_*.csv data/transfer_rumors_*.csv data/players_*.csv data/market_value_*.csv"
            SUBJECT="이적·부상·계약·루머·시장가치"
          fi
          git add -- $PATHS
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): TM 클라우드 수집 — $SUBJECT [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi

      - name: Report collector failures
        if: always()
        run: bash scripts/ci_report.sh
