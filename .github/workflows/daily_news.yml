name: Daily News Fetch

# 2시간마다 ESPN+RSS+Google News(팀별 현지어·영어 이적) 뉴스를 수집해 data/news.db 에 누적하고, 분류(종류·이적 단계·기자)·번역 뒤
# 넓힌 무료 원천(src/news_wires.py, 2026-10-21): 8개 나라 매체 RSS(요약·작성자)·FotMob 팀 뉴스·블루스카이 기자 계정 — 실행마다 약 1~2분
# news.db 는 main 이 아닌 data-news 브랜치(압축본 한 개, 강제 푸시)에 두고 main 에는 포인터 data/news_db.ref.json 만 커밋
# (src/news_store.py — news.db 가 저장소 이력의 99%였다, 2026-10-21). Render 는 그 main 커밋으로 다시 배포하며 포인터의 sha 를 받는다.
# 번역은 무료 공급자만(src/translate.py): GEMINI_API_KEY 시크릿이 있으면 Gemini 무료 등급, 없거나
# 한도 소진이면 구글 무료 번역. 실패한 건 비워 두고 다음 실행이 채운다. 수동 실행도 가능(workflow_dispatch).
on:
  schedule:
    - cron: "0 */2 * * *"   # 2시간마다 (뉴스 신선도 — 무료 번역 한도 고려해 매시간은 지양)
  workflow_dispatch:

concurrency:
  group: daily-news-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 평소 10~25분(번역 예산 18분 포함) — 번역·AI 가 매달려도 6시간 묵지 않게(2026-10-20 첫 Google 실행이 40분 넘게 걸림)
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"   # 로그가 버퍼에 묶여 어디서 멈췄는지 안 보이던 것
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        # 뉴스 수집 체인 실제 의존성만(ui.common 이 unidecode 사용, streamlit 은 이제 지연 import 라 불필요)
        run: pip install requests feedparser pandas unidecode

      # 지난 실행의 news.db — 못 받으면 멈춘다(빈 DB 로 시작해 보관소를 덮어쓰지 않게)
      - name: Restore news.db (data-news)
        run: python src/news_store.py pull --strict

      - name: Fetch & store news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # ci_try — 실패도 실행 원장(data/ops/runs/daily_news.jsonl)에 남기고, 끝의 ci_report 가 빨간불로 알린다
        run: bash scripts/ci_try.sh "news" python scripts/fetch_news_daily.py --all   # 전 리그(라이트 리그 포함, src/leagues.py)

      # 팀 뉴스 탭 맨 위 TODAY'S BRIEF — 최근 48시간 기사 1~3줄(새 기사가 생긴 팀만, 팀당 6시간에 한 번, 10팀씩 묶어 요청)
      - name: AI team news brief (팀 뉴스 요약)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash scripts/ci_try.sh "news_digest" python src/ai_notes.py news

      - name: Publish collection summary
        if: always()
        run: |
          echo "### News data changes" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          ls -la data/news.db >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          cat data/news_db.ref.json >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Store news.db + commit pointer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 먼저 data-news 에 올리고(기사 수가 직전의 80% 미만이면 거부) 그 sha 를 포인터로 — Render 가 main 커밋으로 배포하며 받는다
          python src/news_store.py push
          git add data/news_db.ref.json data/ops/runs/ data/ai/
          # Google News 검색용 현지 클럽 표기(위키 언어 간 링크, 7일 캐시) · AI 가 찾은 기자 목록(src/news_classify.py)
          # 매체·기자 적중률(src/news_reliability.py — 루머 vs 실제 이적)
          # 넓힌 원천 상태(src/news_wires.py) — 매체 RSS 목록·발견 후보·실패 횟수, 블루스카이 기자 계정, FotMob 팀 id
          for f in data/club_local_names.json data/news_journalists.csv data/news_reliability.csv data/news_claims.csv \
                   data/news_feeds.json data/news_insiders.json data/fotmob_team_ids.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(news): 뉴스 수집 [skip ci]"
            # 동시 실행 push 충돌 대비 — rebase 후 재시도
            bash scripts/ci_push.sh   # 충돌 시 이번 수집 값으로 다시 얹고, 못 올리면 실패(조용한 유실 방지)
          fi

      # 커밋 뒤에 검사 — 번역이 막혀도 수집분은 저장하고, 실패는 빨간 실행으로 드러낸다
      - name: Check translation rate
        run: python scripts/fetch_news_daily.py --check

      - name: Report collector failures
        if: always()
        run: bash scripts/ci_report.sh
