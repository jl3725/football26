name: Daily News Fetch

# 2시간마다 ESPN+RSS+Google News(팀별 현지어·영어 이적) 뉴스를 수집해 data/news.db 에 누적하고, 분류(종류·이적 단계·기자)·번역 뒤 커밋.
# 번역은 무료 공급자만(src/translate.py): GEMINI_API_KEY 시크릿이 있으면 Gemini 무료 등급, 없거나
# 한도 소진이면 구글 무료 번역. 실패한 건 비워 두고 다음 실행이 채운다. 수동 실행도 가능(workflow_dispatch).
on:
  schedule:
    - cron: "0 */2 * * *"   # 2시간마다 (뉴스 신선도 — 무료 번역 한도 고려해 매시간은 지양)
  workflow_dispatch:

concurrency:
  group: daily-news-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 평소 2~5분 — 번역·AI 가 매달려도 6시간 묵지 않게(2026-10-20 첫 Google 실행이 40분 넘게 걸림)
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"   # 로그가 버퍼에 묶여 어디서 멈췄는지 안 보이던 것
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # 뉴스 수집 체인 실제 의존성만(ui.common 이 unidecode 사용, streamlit 은 이제 지연 import 라 불필요)
        run: pip install requests feedparser pandas unidecode

      - name: Fetch & store news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # ci_try — 실패도 실행 원장(data/ops/runs/daily_news.jsonl)에 남기고, 끝의 ci_report 가 빨간불로 알린다
        run: bash scripts/ci_try.sh "news" python scripts/fetch_news_daily.py --all   # 지원 8개 리그

      # 팀 뉴스 탭 맨 위 TODAY'S BRIEF — 최근 48시간 기사 1~3줄(새 기사가 생긴 팀만, 팀당 6시간에 한 번, 10팀씩 묶어 요청)
      - name: AI team news brief (팀 뉴스 요약)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash scripts/ci_try.sh "news_digest" python src/ai_notes.py news

      - name: Publish collection summary
        if: always()
        run: |
          echo "### News data changes" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          git status --short data/news.db >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated news.db
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.db data/ops/runs/ data/ai/
          # Google News 검색용 현지 클럽 표기(위키 언어 간 링크, 7일 캐시) · AI 가 찾은 기자 목록(src/news_classify.py)
          for f in data/club_local_names.json data/news_journalists.csv; do [ -f "$f" ] && git add "$f"; done
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(news): 뉴스 수집 [skip ci]"
            # 동시 실행 push 충돌 대비 — rebase 후 재시도
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi

      # 커밋 뒤에 검사 — 번역이 막혀도 수집분은 저장하고, 실패는 빨간 실행으로 드러낸다
      - name: Check translation rate
        run: python scripts/fetch_news_daily.py --check

      - name: Report collector failures
        if: always()
        run: bash scripts/ci_report.sh
