name: Daily News Fetch

# 매일 06:10 UTC(한국 15:10)에 ESPN+RSS 뉴스를 수집·번역해 data/news.db에 누적 커밋.
# 수동 실행도 가능(workflow_dispatch).
on:
  schedule:
    - cron: "0 */2 * * *"   # 2시간마다 (뉴스 신선도 — 구글 번역 rate-limit 고려해 매시간은 지양)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # 뉴스 수집 체인 실제 의존성만(ui.common 이 unidecode 사용, streamlit 은 이제 지연 import 라 불필요)
        run: pip install requests feedparser deep-translator pandas unidecode

      - name: Fetch & store news
        run: python scripts/fetch_news_daily.py --all   # EPL + LaLiga + SerieA + Bundesliga

      - name: Commit updated news.db
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.db
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(news): 뉴스 수집 [skip ci]"
            # 동시 실행 push 충돌 대비 — rebase 후 재시도
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi
