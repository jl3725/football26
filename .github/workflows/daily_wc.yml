name: Daily World Cup Fetch

# 대회 기간 매시간 ESPN(fifa.world)에서 월드컵 데이터를 수집해
# data/wc_*.csv 를 커밋 → Render 재배포 시 DB 재빌드로 반영.
# 당일 녹아웃 결과를 최대한 빨리 반영하려 매시간(daily 2회로는 당일 결과 지연).
# WC 는 ESPN 순수 JSON API 만 쓰므로(번역·RSS 없음) GH Actions 러너에서도 안정적.
# (GH 예약 실행은 부하 시 수~수십분 지연될 수 있음). 대회 종료 후 cron 주석 처리.
# 2026 월드컵 종료(7/19) — 예약 실행 비활성화. ESPN 이 대회 기간 밖 조회에 400 을 반환해
# 매시간 실패만 쌓였음. 다음 대회(유로 2028 등) 때 아래 schedule 주석을 해제.
on:
  # schedule:
  #   - cron: "0 * * * *"    # 매시간 (대회 기간 — 당일 결과 빠른 반영)
  workflow_dispatch:

concurrency:
  group: daily-world-cup-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch World Cup data (matches·scorers·assists·groups·squads)
        run: python src/fetch_wc.py

      - name: Fetch FIFA world ranking (top 30 · 변동)
        run: python src/fetch_fifa_ranking.py

      - name: Publish collection summary
        if: always()
        run: |
          echo "### World Cup data changes" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          git status --short data/wc_*.csv data/fifa_ranking.csv >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated wc_*.csv
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wc_matches.csv data/wc_scorers.csv data/wc_assists.csv data/wc_groups.csv data/wc_squads.csv data/fifa_ranking.csv
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(wc): 월드컵 수집 [skip ci]"
            # 동시 실행 push 충돌 대비 — rebase 후 재시도
            bash scripts/ci_push.sh   # 충돌 시 이번 수집 값으로 다시 얹고, 못 올리면 실패(조용한 유실 방지)
          fi
