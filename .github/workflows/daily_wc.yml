name: Daily World Cup Fetch

# 대회 기간 매시간 ESPN(fifa.world)에서 월드컵 데이터를 수집해
# data/wc_*.csv 를 커밋 → Render 재배포 시 DB 재빌드로 반영.
# 당일 녹아웃 결과를 최대한 빨리 반영하려 매시간(daily 2회로는 당일 결과 지연).
# WC 는 ESPN 순수 JSON API 만 쓰므로(번역·RSS 없음) GH Actions 러너에서도 안정적.
# (GH 예약 실행은 부하 시 수~수십분 지연될 수 있음). 대회 종료 후 cron 주석 처리.
on:
  schedule:
    - cron: "0 * * * *"    # 매시간 (대회 기간 — 당일 결과 빠른 반영). 종료 후 주석 처리.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch World Cup data (matches·scorers·assists·groups·squads)
        run: python src/fetch_wc.py

      - name: Fetch FIFA world ranking (top 30 · 변동)
        run: python src/fetch_fifa_ranking.py

      - name: Commit updated wc_*.csv
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wc_matches.csv data/wc_scorers.csv data/wc_assists.csv data/wc_groups.csv data/wc_squads.csv data/fifa_ranking.csv
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(wc): 월드컵 수집 [skip ci]"
            # 동시 실행 push 충돌 대비 — rebase 후 재시도
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi
