name: Match Refresh

# 유럽 경기가 끝난 직후(한국 아침) 결과·순위·전 리그 홈을 한 번 더 갱신한다.
# daily_data(04:30 UTC = 한국 13:30)만으로는 새벽 경기 결과가 낮까지 '예정'으로 남았다(2026-10-15 사용자 지적).
# 경기 중·직후 화면의 스코어는 Vercel 서버 라우트(web/app/live-scores, ESPN 30초)가 바로 덮어쓰고,
# 이 작업은 원본 데이터(순위·폼·결과 띠·빅매치 목록·주목할 매치·리그/컵 라인업)를 맞춘다. 감독·부상 등은 daily_data 담당.
# 경기일에는 match_watch.yml 이 경기 종료 20분 뒤 이 작업을 바로 실행한다(재배포가 잦지 않게 90분에 한 번, 마지막 물결은 바로).
# 아래 예약은 감시가 놓친 경기를 아침에 한 번 더 맞추는 안전망.
on:
  schedule:
    - cron: "15 23 * * *"   # 매일 23:15 UTC (한국 08:15) — 유럽 야간 경기 종료 후
  workflow_dispatch:

concurrency:
  group: match-refresh-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # 수집기는 requests·bs4 를 쓰는데 백엔드 requirements.txt 엔 없다(daily_data 와 같은 목록 + 백엔드)
        run: pip install -q requests beautifulsoup4 lxml pandas unidecode soccerdata==1.9.0 && pip install -q -r requirements.txt

      - name: Schedule · standings (전 리그, ESPN)
        run: |
          for LG in EPL LaLiga SerieA Bundesliga Ligue1 LigaPortugal Eredivisie BelgianProLeague; do
            bash scripts/ci_try.sh "schedule $LG" python src/fetch_schedule.py --league $LG
            FB_LEAGUE=$LG bash scripts/ci_try.sh "standings $LG" python src/standings_from_schedule.py
          done

      # 라이트 리그(챔피언십·쉬페르리그·오스트리아·덴마크·스위스 — 2026-10-22 1단계 확장): FBref·ESPN 대신 FotMob 리그·팀
      # 응답으로 순위·일정·1군 명단·감독·팀 대조표(src/lite_league.py). 경기별 기록·라인업·교체는 FotMob match ratings 단계가 같이 쓴다
      - name: Lite leagues (라이트 리그 순위·일정·명단·감독)
        run: bash scripts/ci_try.sh "lite_league" python src/lite_league.py

      # 리그 라인업·교체(증분) — 예전엔 daily_data(한국 오후)에서만 받아, 아침에 결과는 바뀌어도 팀 FORMATION·
      # 경기 라인업이 저녁까지 한 경기 늦었다(2026-10-19 사용자 지적: 아스날 노팅엄전 대신 리즈전 라인업).
      - name: League lineups · subs (전 리그, ESPN)
        run: |
          for LG in EPL LaLiga SerieA Bundesliga Ligue1 LigaPortugal Eredivisie BelgianProLeague; do
            FB_LEAGUE=$LG bash scripts/ci_try.sh "lineups $LG" python src/fetch_espn_lineups.py
            FB_LEAGUE=$LG bash scripts/ci_try.sh "subs $LG" python src/fetch_espn_subs.py
          done

      # 컵·유럽대항전 라인업·교체 — Player 탭 SEASON LOG(챔스·컵 출전 분) 원천. 예전엔 주 1회 로컬 빌드에서만 받았다.
      - name: Cup lineups (컵·유럽 라인업, 전 리그)
        run: |
          for LG in EPL LaLiga SerieA Bundesliga Ligue1 LigaPortugal Eredivisie BelgianProLeague; do
            FB_LEAGUE=$LG bash scripts/ci_try.sh "cup_lineups $LG" python src/fetch_cup_lineups.py --league $LG
          done

      # 역할 축(대회별 선발·출전) — 위 컵·유럽 라인업에서 매일 다시 센다. 예전엔 로컬 주간 빌드에서만 만들어져
      # UCL 2경기 모두 선발인 Haaland 가 '유럽 로테이션'으로 남았다(2026-10-20 점검, src/comp_usage_live.py)
      - name: Competition usage (역할 근거)
        run: bash scripts/ci_try.sh "comp_usage_live" python src/comp_usage_live.py

      - name: Match stats (ESPN 경기 기록 + 5대 리그 Understat xG — 분석 탭 경기별 흐름·시간대·백분위)
        # 새로 끝난 경기만 받는다(src/fetch_match_stats.py, 증분). Understat 실패 시 ESPN 기록만 저장.
        run: |
          for LG in EPL LaLiga SerieA Bundesliga Ligue1 LigaPortugal Eredivisie BelgianProLeague; do
            FB_LEAGUE=$LG bash scripts/ci_try.sh "match_stats $LG" python src/fetch_match_stats.py
          done

      # 경기별 선수 평점(FotMob, 리그·유럽·컵) — 선수 '최근 폼'(LAST 5)과 SEASON LOG 경기별 평점 원천(src/recent_form.py).
      # 새로 끝난 경기만 받는다. 시즌 폼만으로는 한두 경기 부진이 안 보였다(2026-10-19 사용자: 사카 노팅엄전).
      - name: FotMob match ratings (최근 폼)
        run: bash scripts/ci_try.sh "fotmob_matches" python src/fetch_fotmob_matches.py

      # 선수 xG 계열(xg·npxg·xa·키패스·슈팅·xG chain) — 5대 리그 Understat 리그당 1요청, 화면 선수 표가 덮어씀(주간 빌드 대신 매일)
      - name: Understat player xG (매일)
        run: bash scripts/ci_try.sh "understat_live" python src/fetch_understat_live.py

      # 결장 명단(FotMob 다음 경기 unavailable · 경기 중 부상 교체) — 경기 다음 날 아침에 바로(TM 은 며칠 늦다)
      - name: FotMob injuries (결장 명단)
        run: bash scripts/ci_try.sh "fotmob_injuries" python src/fetch_fotmob_injuries.py

      # FotMob 팀 명단(등록 1군 전원·세부 포지션·생년월일·부상 복귀 예상) — 출전 없는 선수(백업 GK)·빈 나이·부상 표시(src/fotmob_squads.py)
      - name: FotMob squads (팀 명단)
        run: bash scripts/ci_try.sh "fotmob_squads" python src/fotmob_squads.py

      # 라이트 리그 선수 표(FotMob 시즌 통계 + TM 시장가치·계약) → 팀 유닛 지표·팀 득실 — 주간 빌드 없이 매일(src/build_lite_players.py)
      - name: Lite league players (라이트 리그 선수 표·팀 지표)
        run: |
          bash scripts/ci_try.sh "lite_players" python src/build_lite_players.py
          bash scripts/ci_try.sh "lite_players prev" python src/build_lite_players.py --season prev
          for LG in $(python scripts/league_keys.py --lite); do
            FB_LEAGUE=$LG bash scripts/ci_try.sh "unit_metrics $LG" python src/build_team_unit_metrics.py
            FB_LEAGUE=$LG bash scripts/ci_try.sh "team_defense $LG" python src/fetch_team_defense.py
          done

      - name: Refresh global home snapshot (home_all.json)
        run: |
          python scripts/build_db.py > /dev/null
          bash scripts/ci_try.sh "precompute_hub" python scripts/precompute_hub.py

      # 경기 전 예측 기록(팬 투표·우리 모델·ClubElo) → 결과 대조 — 홈 PREDICTION LEAGUE 원천(scripts/log_predictions.py)
      - name: Log predictions (팬 vs 모델 성적표)
        run: bash scripts/ci_try.sh "log_predictions" python scripts/log_predictions.py

      # AI 경기 리포트 — 최근 3일 끝난 경기의 MATCH REVIEW 데이터로 3~4문장(Gemini 무료 등급, 숫자·이름 원자료 대조).
      # 이미 만든 경기는 건너뛰고, 검증에 두 번 떨어진 경기는 포기(src/ai_notes.py). 키가 없으면 건너뜀
      - name: AI match reports (경기 리포트)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash scripts/ci_try.sh "ai_match" python src/ai_notes.py match

      # 선수 이름 레지스트리 — 원천마다 다른 표기를 기준 표기로 묶는다(src/player_registry.py, API 가 읽을 때 정규화)
      - name: Player registry (이름 정규화)
        run: bash scripts/ci_try.sh "player_registry" python src/player_registry.py

      - name: Validate core data contracts
        run: python scripts/validate_data.py --no-optional

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): 경기 결과·순위 아침 갱신 [skip ci]"
            bash scripts/ci_push.sh   # 충돌 시 이번 수집 값으로 다시 얹고, 못 올리면 실패(조용한 유실 방지)
          fi

      - name: Report collector failures
        if: always()
        run: bash scripts/ci_report.sh
