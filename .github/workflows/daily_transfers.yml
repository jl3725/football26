name: Daily Transfers Fetch

# 매일 06:30 UTC, 현재 활성 이적시장(날짜로 자동 판정)을 Transfermarkt에서 긁어
# data/transfers_2025_2026.csv에 시즌별 누적 갱신 후 변경 시에만 커밋.
on:
  schedule:
    - cron: "0 23,5,11 * * *"   # 하루 3회 08·14·20 KST (23·05·11 UTC). TM 부하·차단 위험 고려해 시간단위 지양.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pandas unidecode

      - name: Fetch transfers
        run: python src/fetch_transfers.py

      - name: Commit updated transfers
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/transfers_2025_2026.csv
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(transfers): 이적시장 수집 [skip ci]"
            # 동시 실행 push 충돌 대비 — rebase 후 재시도
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi
