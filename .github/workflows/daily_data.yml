name: Daily Data Fetch

# 리그홈·오버뷰가 쓰는 "로컬 전용" 수집기들을 클라우드로 이관 — 하루 1회.
#   감독 프로필/교체 · 승격 로스터 · 이적 소문(buzz, 뉴스 RSS) · 일정 · UEFA 계수 · FIFA 랭킹
# (Transfermarkt 계열은 GH 러너 차단으로 로컬 agent 담당 — 아래 주석 참고)
# 이 데이터들이 그동안 로컬 PC(작업 스케줄러)에서만 갱신돼 리그홈이 멈춰 보였음.
# Transfermarkt·ESPN·위키 모두 GH 러너에서 정상(daily_transfers 가 이미 증명) → 전부 이관 가능.
# 각 단계는 scripts/ci_try.sh 로 감싸 하나 실패해도 나머지 수집·커밋은 진행하고,
# 마지막 단계(ci_report.sh)에서 실패 목록을 요약한 뒤 워크플로를 실패 처리한다.
# (무거운 tm_injury_history 는 weekly_injury.yml 로 분리)
on:
  schedule:
    - cron: "30 4 * * *"   # 매일 04:30 UTC (한국 13:30) — WC(매시간 :00)·이적(05:00)·뉴스(짝수시 :00)와 시차
  workflow_dispatch:

concurrency:
  group: daily-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pandas unidecode feedparser deep-translator

      - name: Managers · season teams · manager changes (전 리그)
        run: |
          bash scripts/ci_try.sh "sync_manager_profiles" python src/sync_manager_profiles.py --write
          bash scripts/ci_try.sh "enrich_manager" python src/enrich_manager_profiles.py --write --only-missing --sleep 1.0
          bash scripts/ci_try.sh "enrich_team" python src/enrich_team_profiles.py --write --only-missing --sleep 1.0
          bash scripts/ci_try.sh "season_teams EPL" python src/detect_season_teams.py --write
          bash scripts/ci_try.sh "laliga_managers" python src/fetch_laliga_managers.py
          bash scripts/ci_try.sh "season_teams LaLiga" python src/detect_season_teams.py --league LaLiga --write
          bash scripts/ci_try.sh "mgr_changes LaLiga" python src/detect_manager_changes.py --league LaLiga --write
          bash scripts/ci_try.sh "serie_managers" python src/fetch_serie_managers.py
          bash scripts/ci_try.sh "season_teams SerieA" python src/detect_season_teams.py --league SerieA --write
          bash scripts/ci_try.sh "mgr_changes SerieA" python src/detect_manager_changes.py --league SerieA --write
          bash scripts/ci_try.sh "bundes_managers" python src/fetch_bundes_managers.py
          bash scripts/ci_try.sh "season_teams Bundesliga" python src/detect_season_teams.py --league Bundesliga --write
          bash scripts/ci_try.sh "mgr_changes Bundesliga" python src/detect_manager_changes.py --league Bundesliga --write
          bash scripts/ci_try.sh "ligue_managers" python src/fetch_ligue_managers.py
          bash scripts/ci_try.sh "season_teams Ligue1" python src/detect_season_teams.py --league Ligue1 --write
          bash scripts/ci_try.sh "mgr_changes Ligue1" python src/detect_manager_changes.py --league Ligue1 --write
          bash scripts/ci_try.sh "ligapt_managers" python src/fetch_ligaportugal_managers.py
          bash scripts/ci_try.sh "season_teams LigaPortugal" python src/detect_season_teams.py --league LigaPortugal --write
          bash scripts/ci_try.sh "mgr_changes LigaPortugal" python src/detect_manager_changes.py --league LigaPortugal --write
          bash scripts/ci_try.sh "erediv_managers" python src/fetch_eredivisie_managers.py
          bash scripts/ci_try.sh "season_teams Eredivisie" python src/detect_season_teams.py --league Eredivisie --write
          bash scripts/ci_try.sh "mgr_changes Eredivisie" python src/detect_manager_changes.py --league Eredivisie --write
      - name: Transfer buzz · schedule (전 리그)
        run: |
          bash scripts/ci_try.sh "buzz EPL" python src/fetch_transfer_buzz.py
          for LG in LaLiga SerieA Bundesliga Ligue1 LigaPortugal Eredivisie; do
            bash scripts/ci_try.sh "buzz $LG" python src/fetch_transfer_buzz.py --league $LG
          done
          for LG in EPL LaLiga SerieA Bundesliga Ligue1 LigaPortugal Eredivisie BelgianProLeague; do
            bash scripts/ci_try.sh "schedule $LG" python src/fetch_schedule.py --league $LG
          done

      # 주의: 순위(fetch_standings)는 soccerdata(FBref) 의존 + 25/26 최종 확정 상태라 제외.
      # 26/27 시즌 개막(8월) 시 fetch_standings + soccerdata 를 이 워크플로에 추가할 것.
      # Transfermarkt 계열(현재 부상·계약·루머·시장가치 스냅샷·이적)은 2026-07-15부터 TM(AWS WAF)이
      # GH 러너 IP 에 202 챌린지를 반환해 클라우드 수집 불가 → 로컬 PC agent 로 이관
      # (scripts/run_tm_agent.ps1 · register_tm_agent.ps1, 매일 10:30/18:30).

      - name: UEFA 계수 (협회·클럽, 리그강도 근거화)
        run: bash scripts/ci_try.sh "uefa_coefficients" python src/fetch_uefa_coefficients.py

      - name: FIFA 랭킹 (월드컵 탭 TOP30 — daily_wc 비활성화로 이관)
        run: bash scripts/ci_try.sh "fifa_ranking" python src/fetch_fifa_ranking.py

      - name: Validate core data contracts
        run: python scripts/validate_data.py --no-optional   # 품질 게이트 — 실패 시 커밋 차단

      - name: Publish collection summary
        if: always()
        run: |
          echo "### Daily data changes" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          git status --short data/ >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): 감독·일정·소문·계수 수집 [skip ci]"
            # 동시 실행 push 충돌 대비 — rebase 후 재시도
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi

      - name: Report collector failures
        if: always()
        run: bash scripts/ci_report.sh
