name: Daily Data Fetch

# 리그홈·오버뷰가 쓰는 "로컬 전용" 수집기들을 클라우드로 이관 — 하루 1회.
#   감독 프로필/교체 · 승격 로스터 · 이적 소문(buzz, 뉴스 RSS) · 일정·순위·라인업 · UEFA 계수 · FIFA 랭킹
# (Transfermarkt 계열은 tm_data.yml — 브라우저 토큰으로 클라우드 수집)
# 이 데이터들이 그동안 로컬 PC(작업 스케줄러)에서만 갱신돼 리그홈이 멈춰 보였음.
# 각 단계는 scripts/ci_try.sh 로 감싸 하나 실패해도 나머지 수집·커밋은 진행하고,
# 마지막 단계(ci_report.sh)에서 실패 목록을 요약한 뒤 워크플로를 실패 처리한다.
on:
  schedule:
    - cron: "30 4 * * *"   # 매일 04:30 UTC (한국 13:30) — WC(매시간 :00)·이적(05:00)·뉴스(짝수시 :00)와 시차
  workflow_dispatch:

concurrency:
  group: daily-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 감독 소개·이적 소문 번역(무료 등급, src/translate.py)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pandas unidecode feedparser

      - name: Managers · season teams · manager changes (전 리그)
        run: |
          bash scripts/ci_try.sh "sync_manager_profiles" python src/sync_manager_profiles.py --write
          bash scripts/ci_try.sh "enrich_manager" python src/enrich_manager_profiles.py --write --only-missing --sleep 1.0
          bash scripts/ci_try.sh "enrich_team" python src/enrich_team_profiles.py --write --only-missing --sleep 1.0
          bash scripts/ci_try.sh "season_teams EPL" python src/detect_season_teams.py --write
          bash scripts/ci_try.sh "laliga_managers" python src/fetch_laliga_managers.py
          bash scripts/ci_try.sh "season_teams LaLiga" python src/detect_season_teams.py --league LaLiga --write
          bash scripts/ci_try.sh "mgr_changes LaLiga" python src/detect_manager_changes.py --league LaLiga --write
          bash scripts/ci_try.sh "serie_managers" python src/fetch_serie_managers.py
          bash scripts/ci_try.sh "season_teams SerieA" python src/detect_season_teams.py --league SerieA --write
          bash scripts/ci_try.sh "mgr_changes SerieA" python src/detect_manager_changes.py --league SerieA --write
          bash scripts/ci_try.sh "bundes_managers" python src/fetch_bundes_managers.py
          bash scripts/ci_try.sh "season_teams Bundesliga" python src/detect_season_teams.py --league Bundesliga --write
          bash scripts/ci_try.sh "mgr_changes Bundesliga" python src/detect_manager_changes.py --league Bundesliga --write
          bash scripts/ci_try.sh "ligue_managers" python src/fetch_ligue_managers.py
          bash scripts/ci_try.sh "season_teams Ligue1" python src/detect_season_teams.py --league Ligue1 --write
          bash scripts/ci_try.sh "mgr_changes Ligue1" python src/detect_manager_changes.py --league Ligue1 --write
          bash scripts/ci_try.sh "ligapt_managers" python src/fetch_ligaportugal_managers.py
          bash scripts/ci_try.sh "season_teams LigaPortugal" python src/detect_season_teams.py --league LigaPortugal --write
          bash scripts/ci_try.sh "mgr_changes LigaPortugal" python src/detect_manager_changes.py --league LigaPortugal --write
          bash scripts/ci_try.sh "erediv_managers" python src/fetch_eredivisie_managers.py
          bash scripts/ci_try.sh "season_teams Eredivisie" python src/detect_season_teams.py --league Eredivisie --write
          bash scripts/ci_try.sh "mgr_changes Eredivisie" python src/detect_manager_changes.py --league Eredivisie --write
          # 벨기에 — 시즌 문서에 감독표가 없어 클럽 문서 인포박스에서(바뀐 감독은 수집기가 직접 manager_changes 에)
          bash scripts/ci_try.sh "belgian_managers" python src/fetch_belgian_managers.py
      - name: Transfer buzz · schedule (전 리그)
        run: |
          bash scripts/ci_try.sh "buzz EPL" python src/fetch_transfer_buzz.py
          for LG in LaLiga SerieA Bundesliga Ligue1 LigaPortugal Eredivisie; do
            bash scripts/ci_try.sh "buzz $LG" python src/fetch_transfer_buzz.py --league $LG
          done
          for LG in EPL LaLiga SerieA Bundesliga Ligue1 LigaPortugal Eredivisie BelgianProLeague; do
            bash scripts/ci_try.sh "schedule $LG" python src/fetch_schedule.py --league $LG
          done

      # 시즌 중 매일: ESPN 결과 → 순위표, 새로 끝난 리그 경기 라인업·교체(증분). 전부 ESPN 이라 GH 에서 동작.
      # (선수 시즌 스탯은 FBref·Sofascore 브라우저가 필요해 로컬 주간 빌드 scripts/build_season.py 담당)
      - name: Standings · lineups · subs (전 리그, ESPN)
        run: |
          for LG in EPL LaLiga SerieA Bundesliga Ligue1 LigaPortugal Eredivisie BelgianProLeague; do
            FB_LEAGUE=$LG bash scripts/ci_try.sh "standings $LG" python src/standings_from_schedule.py
            FB_LEAGUE=$LG bash scripts/ci_try.sh "lineups $LG" python src/fetch_espn_lineups.py
            FB_LEAGUE=$LG bash scripts/ci_try.sh "subs $LG" python src/fetch_espn_subs.py
          done

      # 라이트 리그(챔피언십·쉬페르리그·오스트리아·덴마크·스위스 — 2026-10-22 1단계 확장): FBref·ESPN 대신 FotMob 리그·팀
      # 응답으로 순위·일정·1군 명단·감독·팀 대조표(src/lite_league.py). 경기별 기록·라인업·교체는 FotMob match ratings 단계가 같이 쓴다
      - name: Lite leagues (라이트 리그 순위·일정·명단·감독)
        run: |
          bash scripts/ci_try.sh "lite_league" python src/lite_league.py
          bash scripts/ci_try.sh "lite_managers" python src/lite_league.py --managers   # 감독 소개·전술(위키, 소개 없는 감독만)

      # 감독 프로필 빈칸(부임일·전술 성향) — 위 감독 수집 단계들이 매일 프로필을 새로 써서 그 뒤에 돈다. 부임일 = FotMob 감독 경력
      # → 위키데이터, 성향 = 감독 위키 전술 섹션. 받은 값은 data/manager_fill_cache.json 에 남아 새 감독만 받는다(src/manager_fill.py)
      - name: Manager fill (감독 부임일·전술 성향, 전 리그)
        run: bash scripts/ci_try.sh "manager_fill" python src/manager_fill.py --write

      # Transfermarkt 계열(현재 부상·계약·루머·시장가치 스냅샷·이적)은 tm_data.yml 이 하루 2회 수집한다
      # (TM WAF 202 → 브라우저 토큰, src/tm_http.py). 2026-07~10 은 로컬 PC agent 가 맡았었다.

      # 주장단(주장·부주장·3·4번째)·등번호 — 위키백과 클럽 문서 스쿼드 표, 8개 리그(src/fetch_wiki_squads.py)
      - name: Wikipedia squads (주장단·등번호)
        run: FB_LEAGUE=ALL bash scripts/ci_try.sh "wiki_squads" python src/fetch_wiki_squads.py

      # 감독 커리어(감독·선수 경력) — 위키백과 인포박스, NETWORK 탭 MANAGER 렌즈(src/fetch_manager_careers.py)
      - name: Manager careers (감독 커리어)
        run: bash scripts/ci_try.sh "manager_careers" python src/fetch_manager_careers.py

      # FotMob 시즌 평점(이번·직전·2시즌 전) — Sofascore 와 두 출처 평균 평점(src/rating_blend.py). 공개 JSON
      - name: FotMob ratings (두 출처 평균 평점)
        run: bash scripts/ci_try.sh "fotmob_ratings" python src/fetch_fotmob_ratings.py

      # FotMob 결장 명단(다음 경기 unavailable + 최근 경기 부상 교체) — TM 부상 목록보다 빠르다(src/fetch_fotmob_injuries.py)
      - name: FotMob injuries (결장 명단)
        run: bash scripts/ci_try.sh "fotmob_injuries" python src/fetch_fotmob_injuries.py

      # FotMob 팀 명단(등록 1군 전원·세부 포지션·생년월일·부상 복귀 예상) — 출전 없는 선수(백업 GK)·빈 나이·부상 표시(src/fotmob_squads.py)
      - name: FotMob squads (팀 명단)
        run: bash scripts/ci_try.sh "fotmob_squads" python src/fotmob_squads.py

      # 라이트 리그 선수 표(FotMob 시즌 통계 + TM 시장가치·계약) → 팀 유닛 지표·팀 득실 — 주간 빌드 없이 매일(src/build_lite_players.py)
      - name: Lite league players (라이트 리그 선수 표·팀 지표)
        run: |
          bash scripts/ci_try.sh "lite_players" python src/build_lite_players.py
          bash scripts/ci_try.sh "lite_players prev" python src/build_lite_players.py --season prev
          for LG in $(python scripts/league_keys.py --lite); do
            FB_LEAGUE=$LG bash scripts/ci_try.sh "unit_metrics $LG" python src/build_team_unit_metrics.py
            FB_LEAGUE=$LG bash scripts/ci_try.sh "team_defense $LG" python src/fetch_team_defense.py
          done

      # 과거 시즌 최종 순위(ESPN) — 팀 실적(득점·실점)을 여러 시즌 반영(src/season_history.py). 시즌이 넘어가면
      # 새로 '과거'가 된 시즌 중 우리 파일이 없는 것만 받는다(이미 받은 시즌은 건너뜀)
      - name: Standings history (과거 시즌 순위)
        run: bash scripts/ci_try.sh "standings_history" python src/fetch_standings_history.py

      - name: UEFA 계수 (협회·클럽, 리그강도 근거화)
        run: bash scripts/ci_try.sh "uefa_coefficients" python src/fetch_uefa_coefficients.py

      # 무료 티어는 미사용 시 정지된다(AuraDB 3일, Qdrant Cloud 수일) — 2026-07~10 두 번 다 사라졌음.
      # 매일 한 번 가벼운 조회로 '사용 중' 상태를 유지한다. 시크릿이 없으면 건너뜀.
      - name: Keep optional infra awake (Qdrant · Neo4j)
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          pip install -q qdrant-client==1.12.1 neo4j==5.28.1
          bash scripts/ci_try.sh "infra_ping" python scripts/ping_infra.py

      # 팀 대표색(ESPN) — 손으로 고른 색이 없는 승격팀이 회색으로 나오지 않게(teammeta 대체값)
      - name: Predictions (ClubElo — 독립 Elo 예측 모델, 회사 회선에선 막혀 클라우드에서)
        run: bash scripts/ci_try.sh "clubelo" python src/fetch_clubelo.py

      - name: Team colors (ESPN)
        run: bash scripts/ci_try.sh "team_colors" python src/fetch_team_colors.py

      - name: FIFA 랭킹 (월드컵 탭 TOP30 — daily_wc 비활성화로 이관)
        run: bash scripts/ci_try.sh "fifa_ranking" python src/fetch_fifa_ranking.py

      - name: A매치 일정·기간·소집 명단 (ESPN 국가대표 경기 + 대표팀 위키 'Current squad' → 우리 선수)
        run: bash scripts/ci_try.sh "intl" python src/fetch_intl.py

      # 국가대표 대회 레지스트리 — ESPN 리그 목록에서 남자 성인 국가대표 대회를 자동 발견하고(7일 캐시), 회차별
      # 예정·진행·종료·우승을 일정·결과에서 계산 → 홈 INTERNATIONAL 칩 불빛·대륙별 대회 카드(src/intl_comps.py)
      - name: International competitions (대륙별 대회·상태)
        run: bash scripts/ci_try.sh "intl_comps" python src/intl_comps.py

      # 클럽 라이벌 — 위키 클럽 문서의 라이벌·더비 섹션(+더비 문서)에서 같은 리그 라이벌 자동 판정(7일 캐시라 주 1회만 받음)
      # → 이적 작업대·스카우팅 풀에서 라이벌 구단 선수는 '거래 어려움'(src/club_rivals.py)
      - name: Club rivals (위키 라이벌·더비)
        run: bash scripts/ci_try.sh "club_rivals" python src/club_rivals.py

      # 전 리그 홈(/api/home/all)은 data/home_all.json 스냅샷을 서빙한다(Render 시작 시간 절약).
      # 이걸 매일 다시 만들지 않으면 홈이 마지막 수동 생성 시점(2026-07-07)에 멈춘다.
      - name: Refresh global home snapshot (home_all.json)
        run: |
          pip install -q -r requirements.txt
          python scripts/build_db.py > /dev/null
          bash scripts/ci_try.sh "precompute_hub" python scripts/precompute_hub.py

      # 리그 간(유럽대회) 예측 보정 — 지난 리그 간 경기의 평균 득점·무승부 배수를 다시 잰다(data/model_cross.json,
      # src/predict_model.cross_calibration). 예측 기록보다 먼저 — 오늘 예측이 새 보정값을 쓰게
      - name: Cross-league calibration (리그 간 예측 보정)
        run: bash scripts/ci_try.sh "cross_calibration" python scripts/backtest_cross.py --write

      # 경기 전 예측 기록(팬 투표·우리 모델·ClubElo) → 결과 대조 — 홈 PREDICTION LEAGUE 원천(scripts/log_predictions.py)
      - name: Log predictions (팬 vs 모델 성적표)
        run: bash scripts/ci_try.sh "log_predictions" python scripts/log_predictions.py

      # 선수 평점 일일 기록(변경분만) — 화면의 'OVR ▲▼ 2주 전 대비' 원천(src/rating_history.py).
      # 위 단계에서 만든 football.db 를 써서 운영 API 와 같은 값이 남는다.
      - name: Record player ratings (평점 추이)
        run: bash scripts/ci_try.sh "rating_history" python scripts/record_ratings.py

      # 적정 이적료 — 13개 리그 이적 기록 + 이적 직전 시즌 OVR·시장가치 → 사례 표·배수·정확도(하나 빼고 맞히기)
      # → data/fee_comps.csv · data/fee_model.json (src/fee_comps.py, 리크루트 카드·작업대·스카우트 리포트 FAIR PRICE)
      - name: Fair transfer price (적정 이적료)
        run: bash scripts/ci_try.sh "fee_comps" python src/fee_comps.py

      # 평점 자체 검증 — 사용자 기준·스카우트 기준표·이상치(한 시즌 급등 등) 점검 결과를 남기면 watchdog 이 읽어 이슈로 알린다
      # 출처별 클럽 표기 대조 — 확신 높은 별칭은 자동 등록(data/club_aliases_auto.csv), 애매하면 watchdog 이 '확인 필요'
      - name: Club identity (클럽 표기 자동 별칭)
        run: bash scripts/ci_try.sh "identity" python src/identity.py

      - name: Player registry (이름 정규화)
        run: bash scripts/ci_try.sh "player_registry" python src/player_registry.py

      - name: Rating audit (평점 자체 검증)
        run: bash scripts/ci_try.sh "rating_audit" python scripts/eval_ratings.py --audit-json data/eval/rating_audit.json --no-snapshot

      # OVR 검증 에이전트 — 같은 선수 OVR 이 화면(API)마다 같은지 · 지난 기록 대비 변동(scripts/check_ovr_consistency.py)
      # → data/eval/ovr_audit.json, watchdog 'ovr' 점검이 읽어 불일치면 이슈를 연다
      - name: OVR consistency (화면별 OVR 일치 검증)
        run: bash scripts/ci_try.sh "ovr_consistency" python scripts/check_ovr_consistency.py --detail 3

      - name: Expert expectations (데이터가 바뀌어 사용자 기대치가 깨지면 watchdog 이 알림)
        run: bash scripts/ci_try.sh "expectations" python scripts/eval_expectations.py --out data/eval/expectations_audit.json

      # 화면 간 일치 점검 — 선수 헤더 = SEASON LOG, Overview xG = Analytics, 다른 리그 상대 연결, 리더 최소 출전 …
      # 2026-10-20 사람이 찾은 화면 오류를 규칙으로(scripts/check_screen_consistency.py) → watchdog 'screen'
      - name: Screen consistency (화면 간 일치)
        run: bash scripts/ci_try.sh "screen_audit" python scripts/check_screen_consistency.py

      # WEEKLY DIGEST 서술 한 문단(리그별) — 위 평점 추이·부상·뉴스·루머로 만든 /api/digest 를 Gemini 무료 등급이 요약,
      # 숫자·이름은 원자료 대조(src/ai_notes.py). 키가 없거나 한도면 건너뛰고 화면은 규칙 기반 카드만
      - name: AI weekly digest text (주간 요약 서술)
        run: bash scripts/ci_try.sh "digest_text" python src/ai_notes.py digest

      - name: Validate core data contracts
        run: python scripts/validate_data.py --no-optional   # 품질 게이트 — 실패 시 커밋 차단

      - name: Publish collection summary
        if: always()
        run: |
          echo "### Daily data changes" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          git status --short data/ >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): 감독·일정·소문·계수 수집 [skip ci]"
            # 동시 실행 push 충돌 대비 — rebase 후 재시도
            bash scripts/ci_push.sh   # 충돌 시 이번 수집 값으로 다시 얹고, 못 올리면 실패(조용한 유실 방지)
          fi

      - name: Report collector failures
        if: always()
        run: bash scripts/ci_report.sh
