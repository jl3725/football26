name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  pull_request:
  workflow_dispatch:   # 데이터 커밋([skip ci])과 함께 올라간 코드 커밋도 수동으로 검사할 수 있게

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      FB_SEASON_START: "2026"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Build derived database
        run: python scripts/build_db.py

      - name: Validate data contracts
        run: python scripts/validate_data.py --no-optional

      - name: Compile Python
        run: python -m compileall -q api src scripts app.py

      - name: Check hardcoded season labels
        # 화면 코드(web·api)에 "25/26" 같은 시즌 문구가 박히면 실패 — 시즌은 /api/context 에서 받는다
        run: python scripts/check_season_literals.py

      - name: Test
        run: pytest

      - name: Rating guard (사용자 기준 선수 golden.csv)
        # 평점 공식을 바꿔 사용자가 정한 기대치(Raya ≥ Verbruggen, Costa ≤ 88 등)를 깨면 실패
        run: python scripts/eval_ratings.py --tag ci --check --no-snapshot

      - name: Expert expectations (영향력·주장·포지션·유사 선수 — golden_expectations.csv)
        # 2026-10-19~20 사용자 지적(야말 메인 주장, 마갈량이스 영향력 1위, 흐비차 CM, 사카~만잠비, 홀란 6골)이 다시 생기면 실패
        run: python scripts/eval_expectations.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
