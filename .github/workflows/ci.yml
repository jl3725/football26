name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  pull_request:
  workflow_dispatch:   # 데이터 커밋([skip ci])과 함께 올라간 코드 커밋도 수동으로 검사할 수 있게

permissions:
  contents: read

jobs:
  prod-deps:
    # 운영(Render)과 똑같이 requirements.txt 만 설치하고 API 를 import — 개발용 requirements-dev 에만 있는 패키지를
    # 운영 코드가 쓰면 여기서 실패한다(2026-10-20 requests 누락으로 운영 배포가 4시간 넘게 실패했다)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install production requirements only
        run: pip install -q -r requirements.txt
      - name: Import API like production
        run: python -c "import sys; sys.path[:0]=['.','src']; import api.main; print('api.main import OK')"

  backend:
    runs-on: ubuntu-latest
    env:
      FB_SEASON_START: "2026"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Build derived database
        run: python scripts/build_db.py

      - name: Validate data contracts
        run: python scripts/validate_data.py --no-optional

      - name: Compile Python
        run: python -m compileall -q api src scripts app.py

      - name: Check hardcoded season labels
        # 화면 코드(web·api)에 "25/26" 같은 시즌 문구가 박히면 실패 — 시즌은 /api/context 에서 받는다
        run: python scripts/check_season_literals.py

      - name: Test
        run: pytest

      - name: Rating guard (사용자 기준 선수 golden.csv)
        # 평점 공식을 바꿔 사용자가 정한 기대치(Raya ≥ Verbruggen, Costa ≤ 88 등)를 깨면 실패
        run: python scripts/eval_ratings.py --tag ci --check --no-snapshot

      - name: Expert expectations (영향력·주장·포지션·유사 선수 — golden_expectations.csv)
        # 2026-10-19~20 사용자 지적(야말 메인 주장, 마갈량이스 영향력 1위, 흐비차 CM, 사카~만잠비, 홀란 6골)이 다시 생기면 실패
        run: python scripts/eval_expectations.py --check

      - name: Ask Scout questions (무료 규칙 라우터 — scout_questions.csv)
        # 한글·영문 질문 40개의 의도·팀·리그·포지션·선수. 라우터·한글 이름 사전·선수 표가 바뀌어 질문을 잘못 읽으면 실패
        run: python scripts/eval_scout.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
