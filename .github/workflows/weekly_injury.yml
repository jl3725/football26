name: Weekly Injury History

# 선수별 통산 부상 이력(결장 경기수) — Analytics 부상 임팩트용.
# 선수 1인당 Transfermarkt 페이지를 훑어 매우 무거우므로(리그당 수백명) 주 1회만.
# 현재(활성) 부상은 daily_data.yml 의 fetch_transfermarkt_injuries 가 매일 갱신함.
# 예약 실행 비활성화(2026-10):
#  - 부상 이력: TM 이 GH 러너에 202 챌린지 → 7/20~10/12 매주 전 선수 결장 0경기로 덮어씀(복원 완료).
#    로컬 agent 로 이관(scripts/run_tm_agent.ps1 -Weekly).
#  - 히트맵: Sofascore API 가 로컬·클라우드 모두 403 — 대체 소스 결정 전까지 중단.
on:
  # schedule:
  #   - cron: "0 3 * * 1"   # 매주 월요일 03:00 UTC (한국 월 12:00)
  workflow_dispatch:

concurrency:
  group: weekly-injury-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pandas unidecode wrapper-tls-requests

      - name: Injury history (전 리그)
        run: |
          for LG in EPL LaLiga SerieA Bundesliga Ligue1 LigaPortugal Eredivisie BelgianProLeague; do
            echo "── $LG ──"
            FB_LEAGUE=$LG bash scripts/ci_try.sh "injury_history $LG" python src/fetch_tm_injury_history.py
          done

      - name: Player heatmaps (Sofascore 시즌 활동 구역)
        run: |
          for LG in EPL LaLiga SerieA Bundesliga Ligue1 LigaPortugal Eredivisie BelgianProLeague; do
            echo "── $LG ──"
            FB_LEAGUE=$LG bash scripts/ci_try.sh "heatmap $LG" python src/fetch_sofascore_heatmaps.py
          done

      - name: Publish collection summary
        if: always()
        run: |
          echo "### Weekly injury data changes" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          git status --short data/tm_injury_history_*.csv data/player_heatmaps_*.csv >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tm_injury_history_*.csv data/player_heatmaps_*.csv
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): 통산 부상 이력 + 선수 히트맵 주간 수집 [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi

      - name: Report collector failures
        if: always()
        run: bash scripts/ci_report.sh
