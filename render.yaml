# Render Blueprint — FastAPI 백엔드 무료 배포.
# render.com → New → Blueprint → 이 repo 선택하면 자동 구성.
# 무료 티어: 카드 불필요·만료 없음. 15분 미사용 시 sleep → 다음 요청 때 콜드스타트(~30-60s).
services:
  - type: web
    name: football26-api
    runtime: python
    plan: free
    # football.db 는 빌드 단계에서 만든다 — 예전엔 시작할 때마다(잠들었다 깰 때마다) 다시 만들어
    # 깨어나는 데 30~40초 걸렸다(2026-10-14). 시작 명령은 DB 가 없을 때만 만드는 안전장치를 둔다.
    # 커밋된 data/home_all.json 스냅샷을 _hub_body 가 서빙, 공용 계산은 시작 직후 백그라운드 warm-up.
    # 팀 라인 전력은 빌드에서 미리 계산(data/team_units.json) — 실행 중 0.1 CPU 로 8개 리그 전 팀을 계산하면
    # 홈·Overview 첫 요청이 70초를 넘겼다(2026-10-15). 실패해도 배포는 계속(API 가 즉석 계산으로 대체).
    buildCommand: pip install -r requirements.txt && python scripts/build_db.py && (python scripts/precompute_team_units.py || echo "team_units 건너뜀")
    startCommand: (test -f data/football.db || python scripts/build_db.py) && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    # 백엔드가 읽지 않는 파일만 바뀐 커밋은 재배포하지 않는다 — 재배포마다 메모리 캐시가 비어 첫 방문이 느려진다
    # (2026-10-21 하루 28번 배포, 웹·테스트만 고친 커밋도 포함). 데이터(data/**)·api·src·scripts 는 그대로 배포.
    buildFilter:
      ignoredPaths:
        - web/**
        - tests/**
        - .github/**
        - README.md
        - ARCHITECTURE.md
        - DEPLOY.md
        - DESIGN.md
        - requirements-dev.txt
        - requirements-agents.txt
        - requirements-kg.txt
        - pytest.ini
        - docker-compose.yml
        # 데이터는 재배포하지 않는다 — 실행 중인 서버가 GitHub 에서 바뀐 파일만 받는다(src/live_sync.py: data-live 배포본은
        # Publish Data 워크플로가 이 빌드와 같은 일을 클라우드에서, 뉴스는 data-news). 2026-10-26: 데이터 커밋마다 재배포해
        # 3일 72번 — 그때마다 서버 재시작·캐시 비움. 이제 재배포는 코드가 바뀔 때만
        - data/**
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FB_SEASON_START
        value: "2026"
      # 아래는 Render 대시보드에서 값 설정(시크릿). 미설정 시 해당 기능만 우아하게 비활성.
      - key: QDRANT_URL          # Qdrant Cloud 클러스터 URL (Fit·감독시뮬)
        sync: false
      - key: QDRANT_API_KEY      # Qdrant Cloud API 키
        sync: false
      - key: OPENAI_API_KEY      # Ask Scout(자연어 라우팅)
        sync: false
      - key: SCOUT_TOKEN         # Ask Scout 접근 비밀번호(운영에서는 필수)
        sync: false
      - key: NEO4J_URI           # AuraDB 연결(neo4j+s://…) — graph_query·KG
        sync: false
      - key: NEO4J_USERNAME      # AuraDB username(이 인스턴스는 인스턴스ID, neo4j 아님)
        sync: false
      - key: NEO4J_PASSWORD      # AuraDB 비밀번호
        sync: false
