# Render Blueprint — FastAPI 백엔드 무료 배포.
# render.com → New → Blueprint → 이 repo 선택하면 자동 구성.
# 무료 티어: 카드 불필요·만료 없음. 15분 미사용 시 sleep → 다음 요청 때 콜드스타트(~30-60s).
services:
  - type: web
    name: football26-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/build_db.py && (python scripts/precompute_hub.py || true) && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ALLOWED_ORIGINS
        value: "*"
      # 아래는 Render 대시보드에서 값 설정(시크릿). 미설정 시 해당 기능만 우아하게 비활성.
      - key: QDRANT_URL          # Qdrant Cloud 클러스터 URL (Fit·감독시뮬)
        sync: false
      - key: QDRANT_API_KEY      # Qdrant Cloud API 키
        sync: false
      - key: OPENAI_API_KEY      # Ask Scout(자연어 라우팅)
        sync: false
      - key: SCOUT_TOKEN         # Ask Scout 접근 비밀번호(설정 시 이 토큰 필요, 미설정=공개)
        sync: false
