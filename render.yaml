# Render Blueprint — FastAPI 백엔드 무료 배포.
# render.com → New → Blueprint → 이 repo 선택하면 자동 구성.
# 무료 티어: 카드 불필요·만료 없음. 15분 미사용 시 sleep → 다음 요청 때 콜드스타트(~30-60s).
services:
  - type: web
    name: football26-api
    runtime: python
    plan: free
    # 빌드는 서버 DB·캐시를 만들지 않고 data-live 배포본(Publish Data 가 클라우드에서 같은 일을 한 것)을 받는다
    # (scripts/fetch_live_data.py, 1~2분). 받기에 실패하면 예전처럼 build_db + 팀 라인 전력 미리 계산(실패해도 배포는 계속).
    # 2026-10-29: 빌드 7분 × 코드 커밋마다 자동 배포로 무료 빌드 분(월 500분)을 10/26 에 다 써 그달 배포가 전부 즉시 실패했다.
    # 시작 명령은 DB 가 없을 때만 받는(못 받으면 만드는) 안전장치 — 예전엔 깰 때마다 다시 만들어 30~40초 걸렸다(2026-10-14).
    buildCommand: pip install -r requirements.txt && (python scripts/fetch_live_data.py || (python scripts/build_db.py && (python scripts/precompute_team_units.py || echo "team_units 건너뜀")))
    startCommand: (test -f data/football.db || python scripts/fetch_live_data.py || python scripts/build_db.py) && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # 자동 배포 끔 — 하루 한 번(경기 없는 때)·수동으로만(.github/workflows/deploy_backend.yml → Render Deploy Hook).
    # 배포마다 서버가 다시 떠 캐시가 비고 그 사이 '서버 응답 없음'이 났고, 빌드 분도 아낀다. 데이터는 배포와 무관(live_sync 3분마다)
    autoDeploy: false
    # (자동 배포를 다시 켤 때를 위한 거름망) 백엔드가 읽지 않는 파일만 바뀐 커밋은 재배포하지 않는다 — 재배포마다 메모리 캐시가
    # 비어 첫 방문이 느려진다(2026-10-21 하루 28번 배포, 웹·테스트만 고친 커밋도 포함).
    buildFilter:
      ignoredPaths:
        - web/**
        - tests/**
        - .github/**
        - README.md
        - ARCHITECTURE.md
        - DEPLOY.md
        - DESIGN.md
        - requirements-dev.txt
        - requirements-agents.txt
        - requirements-kg.txt
        - pytest.ini
        - docker-compose.yml
        # 데이터는 재배포하지 않는다 — 실행 중인 서버가 GitHub 에서 바뀐 파일만 받는다(src/live_sync.py: data-live 배포본은
        # Publish Data 워크플로가 이 빌드와 같은 일을 클라우드에서, 뉴스는 data-news). 2026-10-26: 데이터 커밋마다 재배포해
        # 3일 72번 — 그때마다 서버 재시작·캐시 비움. 이제 재배포는 코드가 바뀔 때만
        - data/**
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FB_SEASON_START
        value: "2026"
      # 아래는 Render 대시보드에서 값 설정(시크릿). 미설정 시 해당 기능만 우아하게 비활성.
      - key: QDRANT_URL          # Qdrant Cloud 클러스터 URL (Fit·감독시뮬)
        sync: false
      - key: QDRANT_API_KEY      # Qdrant Cloud API 키
        sync: false
      - key: OPENAI_API_KEY      # Ask Scout(자연어 라우팅)
        sync: false
      - key: SCOUT_TOKEN         # Ask Scout 접근 비밀번호(운영에서는 필수)
        sync: false
      - key: NEO4J_URI           # AuraDB 연결(neo4j+s://…) — graph_query·KG
        sync: false
      - key: NEO4J_USERNAME      # AuraDB username(이 인스턴스는 인스턴스ID, neo4j 아님)
        sync: false
      - key: NEO4J_PASSWORD      # AuraDB 비밀번호
        sync: false
