# 로컬 KG 스택 — Neo4j(그래프) + Qdrant(벡터). 축구 스카우팅 KG/GraphRAG 연습용.
#   docker compose up -d
#   Neo4j 브라우저: http://localhost:7474  (neo4j / football26)
#   Qdrant 대시보드: http://localhost:6335/dashboard  (본업 PB Qdrant 6333 과 분리)
#   빌드 시:  QDRANT_URL=http://localhost:6335 python scripts/build_vectors.py
# 적재: pip install -r requirements-kg.txt && python scripts/build_kg.py && python scripts/build_vectors.py
services:
  neo4j:
    image: neo4j:5-community
    container_name: fb26-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: fb26-qdrant
    ports:
      - "6335:6333"   # REST + dashboard (호스트 6335 — PB Qdrant 6333 과 분리)
      - "6336:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  neo4j_data:
  qdrant_data:
